# Services
services:
  # PostgreSql Service
  postgre:
    container_name: postgre-container
    image: postgres:18.6-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # - ./.docker/postgresql/main/postgresql.cnf:/etc/postgresql/main/postgresql.cnf
      - postgredata:/var/lib/postgresql
    networks:
      cosmetic-store-network:
        ipv4_address: 192.168.5.2

